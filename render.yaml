services:
  - type: web
    name: adaptivelearn-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt && alembic upgrade head && python app/db/seed.py"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: adaptivelearn-postgres
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: AI_PROVIDER
        value: none
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: adaptivelearn-postgres
    plan: free
