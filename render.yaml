services:
  - type: web
    name: adaptivelearn-backend
    env: python
    buildCommand: "bash build.sh"
    startCommand: "bash start.sh"
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: adaptivelearn-postgres
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://adaptivelearn-frontend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://adaptivelearn-frontend.onrender.com,http://localhost:5173
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: adaptivelearn-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://adaptivelearn-backend.onrender.com

databases:
  - name: adaptivelearn-postgres
    plan: free
